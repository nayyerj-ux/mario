name: Deploy to server

# Runs only after the CI workflow has finished successfully on main, so a
# broken build (failing lint/tests) is never shipped to production.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the commit CI just verified
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Generate voice lines (ElevenLabs)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          VOICE_ID: 21m00Tcm4TlvDq8ikWAM
        run: |
          set -euo pipefail
          gen() {
            local text="$1" out="$2"
            curl -sS -f -X POST "https://api.elevenlabs.io/v1/text-to-speech/${VOICE_ID}" \
              -H "xi-api-key: ${ELEVENLABS_API_KEY}" \
              -H "Content-Type: application/json" \
              -d "$(python3 -c 'import json,sys; print(json.dumps({"text": sys.argv[1], "model_id": "eleven_v3"}))' "$text")" \
              -o "$out"
          }
          gen "به قارچ‌خور خوش اومدی! یه موجود کوچولوی جنگلی هستی که عاشق قارچه. آماده‌ای بریم تو ماجراجویی؟" welcome.mp3
          gen "بزن بریم!" start.mp3
          gen "بردی! قهرمان جنگل شدی!" win.mp3
          gen "باختی! دوباره امتحان کن!" lose.mp3
          file welcome.mp3 start.mp3 win.mp3 lose.mp3

      - name: Copy game files and voice lines to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: 'qarchkhor.html,css/*,js/*,assets/fonts/*,welcome.mp3,start.mp3,win.mp3,lose.mp3'
          target: '/srv/www/p06/'
          strip_components: 0

      - name: Publish as index.html
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: cp /srv/www/p06/qarchkhor.html /srv/www/p06/index.html
